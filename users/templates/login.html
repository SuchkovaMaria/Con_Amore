{% extends 'con_amore/background.html' %}
{% block content %}
<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow" style="border-radius: 16px; border: none;">
                <div class="card-header" style="background-color: #5c3d2e; color: white; border-radius: 16px 16px 0 0;">
                    <h4 class="mb-0">Вход в систему</h4>
                </div>
                <div class="card-body" style="padding: 20px;">

                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label fw-bold" style="color: #5c3d2e;">
                                    {{ field.label }}
                                </label>
                                {{ field }}
                                {% if field.errors %}
                                    <div class="text-danger small">{{ field.errors }}</div>
                                {% endif %}
                            </div>
                        {% endfor %}

                        <div class="d-flex gap-2 mt-3">
                            <button type="submit" class="btn flex-grow-1"
                                    style="background-color: #d4a373; color: white; padding: 12px; font-weight: bold; font-size: 1rem; border: none; border-radius: 8px;">
                                Войти
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
