services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ./.env
    environment:
      - HOST=db
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings
    networks:
      - foo

  db:
    image: postgres:16
    container_name: db
    expose:
      - "5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5433
    networks:
      - foo

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    env_file:
      - ./.env
    expose:
      - "6379"
    networks:
      - foo

  celery:
    build: .
    command: celery -A config worker --loglevel=info -P eventlet
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - db
      - redis
    env_file:
      - ./.env
    networks:
      - foo
    restart: always

  celery-beat:
    build: .
    command: celery -A config beat --scheduler django --loglevel=info
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - db
      - redis
      - celery
    env_file:
      - ./.env
    environment:
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - foo
    restart: always


volumes:
  postgres_data:
  redis_data:
  static_volume:

networks:
  foo:
    driver: bridge