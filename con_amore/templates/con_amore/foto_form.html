{% extends 'con_amore/background.html' %}
{% block content %}
<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow" style="border-radius: 16px; border: none;">
                <div class="card-header" style="background-color: #5c3d2e; color: white; border-radius: 16px 16px 0 0;">
                    <h4 class="mb-0">
                        {% if object %}
                            Редактирование фото
                        {% else %}
                            Добавление фото
                        {% endif %}
                    </h4>
                </div>
                <div class="card-body" style="padding: 20px;">

                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}

                        <div class="d-flex gap-2 mt-3">
                            <button type="submit" class="btn flex-grow-1"
                                    style="background-color: #d4a373; color: white; padding: 12px; font-weight: bold; font-size: 1rem; border: none; border-radius: 8px;">
                                {% if object %}
                                    Сохранить
                                {% else %}
                                    Добавить фото
                                {% endif %}
                            </button>
                            <a href="{% url 'con_amore:foto_list' %}"
                               class="btn flex-grow-1"
                               style="background-color: #f8f9fa; color: #5c3d2e; padding: 12px; font-weight: bold; font-size: 1rem; border: 2px solid #d4a373; border-radius: 8px; text-decoration: none; text-align: center;">
                                Вернуться
                            </a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>


{% endblock %}
